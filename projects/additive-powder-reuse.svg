<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Condition-based Ti-6Al-4V powder reuse framework</title>
  <desc id="desc">A five-stage loop from virgin powder through electron-beam powder-bed fusion, recovery, oxygen monitoring and a reuse decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcebe6"/>
      <stop offset="1" stop-color="#b9d8d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#071a22" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b756f"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1238" cy="118" r="178" fill="#f3b35b" opacity=".28"/>
  <circle cx="110" cy="744" r="236" fill="#fff" opacity=".22"/>

  <g transform="translate(86 74)">
    <text x="0" y="0" fill="#246b65" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">E-PBF POWDER REUSE</text>
    <text x="0" y="64" fill="#081c24" font-family="Georgia, 'Times New Roman', serif" font-size="54">Condition over cycle count</text>
    <text x="0" y="105" fill="#4d6868" font-family="Arial, Helvetica, sans-serif" font-size="20">A literature-based decision framework for Ti-6Al-4V</text>
  </g>

  <g fill="none" stroke="#2b756f" stroke-width="5" marker-end="url(#arrow)" opacity=".88">
    <path d="M300 330 H478"/>
    <path d="M690 330 H868"/>
    <path d="M1080 330 C1194 330 1228 400 1228 483"/>
    <path d="M1117 603 H922"/>
    <path d="M708 603 H502"/>
    <path d="M288 603 C168 603 143 506 143 422"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(90 255)">
      <rect width="210" height="150" rx="16" fill="#fff"/>
      <circle cx="32" cy="34" r="14" fill="#f3b35b"/>
      <text x="58" y="40" fill="#2b756f" font-size="15" font-weight="700">01</text>
      <text x="24" y="88" fill="#081c24" font-size="23" font-weight="700">Virgin powder</text>
      <text x="24" y="119" fill="#617676" font-size="15">Known starting condition</text>
    </g>

    <g transform="translate(480 255)">
      <rect width="210" height="150" rx="16" fill="#0b2630"/>
      <circle cx="32" cy="34" r="14" fill="#f3b35b"/>
      <text x="58" y="40" fill="#9ed0c7" font-size="15" font-weight="700">02</text>
      <text x="24" y="88" fill="#fff" font-size="23" font-weight="700">E-PBF build</text>
      <text x="24" y="119" fill="#b8cbc8" font-size="15">Thermal exposure</text>
    </g>

    <g transform="translate(870 255)">
      <rect width="210" height="150" rx="16" fill="#fff"/>
      <circle cx="32" cy="34" r="14" fill="#f3b35b"/>
      <text x="58" y="40" fill="#2b756f" font-size="15" font-weight="700">03</text>
      <text x="24" y="82" fill="#081c24" font-size="22" font-weight="700">Recover &amp; sieve</text>
      <text x="24" y="115" fill="#617676" font-size="15">Record handling history</text>
    </g>

    <g transform="translate(920 528)">
      <rect width="210" height="150" rx="16" fill="#fff"/>
      <circle cx="32" cy="34" r="14" fill="#f3b35b"/>
      <text x="58" y="40" fill="#2b756f" font-size="15" font-weight="700">04</text>
      <text x="24" y="82" fill="#081c24" font-size="22" font-weight="700">Monitor condition</text>
      <text x="24" y="115" fill="#617676" font-size="15">Oxygen &amp; powder state</text>
    </g>

    <g transform="translate(300 528)">
      <rect width="210" height="150" rx="16" fill="#0b2630"/>
      <circle cx="32" cy="34" r="14" fill="#f3b35b"/>
      <text x="58" y="40" fill="#9ed0c7" font-size="15" font-weight="700">05</text>
      <text x="24" y="82" fill="#fff" font-size="22" font-weight="700">Reuse decision</text>
      <text x="24" y="115" fill="#b8cbc8" font-size="15">Reuse, top up or isolate</text>
    </g>
  </g>

  <g transform="translate(578 468)" font-family="Arial, Helvetica, sans-serif">
    <rect width="260" height="97" rx="14" fill="#f3b35b"/>
    <text x="130" y="32" text-anchor="middle" fill="#593914" font-size="13" font-weight="700" letter-spacing="1.4">REPORTED MATERIAL LIMIT</text>
    <text x="130" y="67" text-anchor="middle" fill="#081c24" font-size="25" font-weight="700">0.20 wt% oxygen</text>
  </g>

  <text x="1312" y="766" text-anchor="end" fill="#456b68" font-family="Arial, Helvetica, sans-serif" font-size="14">Monitor the material, not an arbitrary reuse count</text>
</svg>
